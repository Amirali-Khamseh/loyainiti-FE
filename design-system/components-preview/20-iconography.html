<!-- @dsCard group="Brand" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--bg-canvas); display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px; }
  .ic { background: var(--bg-card); border-radius: 10px; box-shadow: var(--shadow-1); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ic i { color: var(--fg-1); }
  .ic span { font: 500 11px/1.1 var(--font-body); color: var(--fg-2); text-align: center; }
  svg.lucide { width: 22px; height: 22px; stroke-width: 1.75; }
</style></head>
<body>
  <div class="ic"><i data-lucide="qr-code"></i><span>qr-code</span></div>
  <div class="ic"><i data-lucide="scan-line"></i><span>scan-line</span></div>
  <div class="ic"><i data-lucide="coffee"></i><span>coffee · visit</span></div>
  <div class="ic"><i data-lucide="gift"></i><span>gift · reward</span></div>
  <div class="ic"><i data-lucide="users"></i><span>users</span></div>
  <div class="ic"><i data-lucide="user-plus"></i><span>user-plus</span></div>
  <div class="ic"><i data-lucide="store"></i><span>store</span></div>
  <div class="ic"><i data-lucide="book-open"></i><span>book-open</span></div>
  <div class="ic"><i data-lucide="bar-chart-3"></i><span>bar-chart-3</span></div>
  <div class="ic"><i data-lucide="trending-up"></i><span>trending-up</span></div>
  <div class="ic"><i data-lucide="calendar"></i><span>calendar</span></div>
  <div class="ic"><i data-lucide="search"></i><span>search</span></div>
  <div class="ic"><i data-lucide="settings"></i><span>settings</span></div>
  <div class="ic"><i data-lucide="wallet"></i><span>wallet</span></div>
  <div class="ic"><i data-lucide="compass"></i><span>compass</span></div>
  <div class="ic" style="background:#FBF4E0"><img src="../assets/stamp.svg" style="width:22px;height:22px"><span style="color:var(--gold-600)">stamp · brand</span></div>
  <script>lucide.createIcons()</script>
</body></html>
