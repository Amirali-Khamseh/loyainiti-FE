<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-canvas); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sw { border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-1); }
  .chip { height: 72px; }
  .meta { padding: 8px 10px; background: var(--bg-card); }
  .name { font: 600 11px/1.2 var(--font-body); color: var(--fg-1); }
  .hex { font: var(--t-num); font-size: 10px; color: var(--fg-3); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FBF8F3"></div><div class="meta"><div class="name">paper-50</div><div class="hex">canvas</div></div></div>
    <div class="sw"><div class="chip" style="background:#F6F1E8"></div><div class="meta"><div class="name">paper-100</div><div class="hex">muted</div></div></div>
    <div class="sw"><div class="chip" style="background:#ECE4D4"></div><div class="meta"><div class="name">paper-200</div><div class="hex">border-subtle</div></div></div>
    <div class="sw"><div class="chip" style="background:#D9CDB4"></div><div class="meta"><div class="name">paper-300</div><div class="hex">border</div></div></div>
    <div class="sw"><div class="chip" style="background:#8E7F66"></div><div class="meta"><div class="name">paper-500</div><div class="hex">fg-3</div></div></div>
    <div class="sw"><div class="chip" style="background:#4A4233"></div><div class="meta"><div class="name">paper-700</div><div class="hex">fg-2</div></div></div>
    <div class="sw"><div class="chip" style="background:#1F1611"></div><div class="meta"><div class="name">espresso-900</div><div class="hex">ink · fg-1</div></div></div>
  </div>
</body></html>
