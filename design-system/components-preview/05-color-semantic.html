<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-canvas); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ex { background: var(--bg-card); border-radius: 10px; box-shadow: var(--shadow-1); padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; }
  .title { font: 600 14px/1.3 var(--font-body); color: var(--fg-1); }
  .desc { font: var(--t-body-sm); color: var(--fg-2); margin-top: 2px; }
  .ok    { background: var(--success-bg); border: 1px solid var(--success-border); }
  .ok .title { color: var(--success); }
  .warn  { background: var(--warning-bg); border: 1px solid var(--warning-border); }
  .warn .title { color: var(--warning); }
  .err   { background: var(--danger-bg); border: 1px solid var(--danger-border); }
  .err .title { color: var(--danger); }
  .info  { background: var(--action-subtle-bg); border: 1px solid var(--terracotta-200); }
  .info .title { color: var(--action-subtle-fg); }
</style></head>
<body>
  <div class="ex ok"><div class="dot" style="background:var(--success)"></div><div><div class="title">Scan recorded · stamp 3 of 4</div><div class="desc">One more visit unlocks a free coffee.</div></div></div>
  <div class="ex warn"><div class="dot" style="background:var(--warning)"></div><div><div class="title">Program ends in 2 days</div><div class="desc">Renew it now so members keep collecting stamps.</div></div></div>
  <div class="ex err"><div class="dot" style="background:var(--danger)"></div><div><div class="title">QR already scanned</div><div class="desc">This code was used 12 seconds ago. Wait a moment.</div></div></div>
  <div class="ex info"><div class="dot" style="background:var(--action)"></div><div><div class="title">12 new members this week</div><div class="desc">Most signups came from the Via Roma table tent.</div></div></div>
</body></html>
