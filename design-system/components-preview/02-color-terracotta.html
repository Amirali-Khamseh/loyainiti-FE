<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-canvas); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-1); }
  .chip { height: 88px; }
  .meta { padding: 10px 12px; background: var(--bg-card); }
  .name { font: 600 13px/1.2 var(--font-body); color: var(--fg-1); }
  .hex { font: var(--t-num); font-size: 11px; color: var(--fg-3); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FBEFE8"></div><div class="meta"><div class="name">terracotta-50</div><div class="hex">#FBEFE8</div></div></div>
    <div class="sw"><div class="chip" style="background:#F3D2C2"></div><div class="meta"><div class="name">terracotta-200</div><div class="hex">#F3D2C2</div></div></div>
    <div class="sw"><div class="chip" style="background:#DB7351"></div><div class="meta"><div class="name">terracotta-500</div><div class="hex">#DB7351</div></div></div>
    <div class="sw"><div class="chip" style="background:#C45A36"></div><div class="meta"><div class="name">terracotta-600 · action</div><div class="hex">#C45A36</div></div></div>
    <div class="sw"><div class="chip" style="background:#A8482B"></div><div class="meta"><div class="name">terracotta-700</div><div class="hex">#A8482B</div></div></div>
  </div>
</body></html>
