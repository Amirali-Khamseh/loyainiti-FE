<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--bg-canvas); display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: center; }
  .ex { background: #ffffff; border-radius: 12px; height: 100px; display: flex; align-items: center; justify-content: center; font: 600 13px/1 var(--font-body); color: var(--fg-2); }
  .s1 { box-shadow: var(--shadow-1); }
  .s2 { box-shadow: var(--shadow-2); }
  .s3 { box-shadow: var(--shadow-3); }
  .label { text-align: center; margin-top: 10px; font: var(--t-caption); color: var(--fg-3); }
</style></head>
<body>
  <div><div class="ex s1">shadow-1</div><div class="label">Raised · cards, list rows</div></div>
  <div><div class="ex s2">shadow-2</div><div class="label">Elevated · popovers, menus</div></div>
  <div><div class="ex s3">shadow-3</div><div class="label">Modal · dialogs, sheets</div></div>
</body></html>
