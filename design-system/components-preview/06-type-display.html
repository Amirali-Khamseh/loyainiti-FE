<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-canvas); }
  .row { display: grid; grid-template-columns: 120px 1fr; align-items: baseline; gap: 18px; padding: 8px 0; border-bottom: 1px dashed var(--paper-200); }
  .row:last-child { border-bottom: 0; }
  .tag { font: var(--t-label); color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.10em; }
</style></head>
<body>
  <div class="row"><div class="tag">display-1 · 56</div><div class="display-1">142 visits.</div></div>
  <div class="row"><div class="tag">display-2 · 40</div><div class="display-2">A warmer coffee card.</div></div>
  <div class="row"><div class="tag">h1 · 32</div><div class="h1">Cafe Aurora — this week</div></div>
  <div class="row"><div class="tag">h2 · 24</div><div class="h2">Top customers</div></div>
</body></html>
