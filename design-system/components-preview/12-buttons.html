<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-canvas); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  button {
    font: 500 14px/1 var(--font-body);
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 10px 16px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
  }
  .primary { background: var(--action); color: var(--action-fg); }
  .primary:hover { background: var(--action-hover); }
  .secondary { background: var(--bg-card); color: var(--fg-1); border-color: var(--border-default); box-shadow: var(--shadow-1); }
  .secondary:hover { background: #faf6ee; }
  .ghost { background: transparent; color: var(--fg-1); }
  .ghost:hover { background: var(--bg-muted); }
  .subtle { background: var(--action-subtle-bg); color: var(--action-subtle-fg); }
  .danger { background: var(--danger); color: #fff; }
  .icon { font-family: var(--font-mono); font-weight: 600; }
  .sm { font-size: 12px; padding: 7px 12px; border-radius: 6px; }
  .lg { font-size: 15px; padding: 13px 22px; border-radius: 10px; }
  .pill { border-radius: 999px; padding: 9px 16px; font-size: 13px; }
  .disabled { opacity: 0.4; pointer-events: none; }
</style></head>
<body>
  <button class="primary">Scan customer QR</button>
  <button class="secondary">Cancel</button>
  <button class="ghost">View all</button>
  <button class="subtle">+ New program</button>
  <button class="danger">End program</button>
  <button class="primary sm">Save</button>
  <button class="primary lg">Publish business</button>
  <button class="secondary pill">7 days</button>
  <button class="primary disabled">Loading…</button>
</body></html>
