<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-canvas); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 10px; padding: 3px; box-shadow: var(--shadow-1); }
  .seg button { font: 500 13px/1 var(--font-body); border: 0; background: transparent; color: var(--fg-2); padding: 7px 14px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--espresso-900); color: var(--paper-50); }
  .pick { display: inline-flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow-1); font: 500 13px/1 var(--font-body); color: var(--fg-1); }
  .pick svg { width: 16px; height: 16px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold-500); display: inline-block; }
</style></head>
<body>
  <div class="seg">
    <button>Today</button>
    <button class="on">7 days</button>
    <button>30 days</button>
    <button>90 days</button>
  </div>
  <div class="pick">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    21 May — 27 May 2026
  </div>
  <div class="pick"><span class="dot"></span>Cafe Aurora ▾</div>
</body></html>
