<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-canvas); display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font: 500 12px/1 var(--font-body); color: var(--fg-2); }
  input, select {
    font: 400 14px/1.2 var(--font-body);
    color: var(--fg-1);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-default);
    background: var(--paper-50);
    outline: none;
  }
  input:focus, select:focus {
    border-color: var(--action);
    box-shadow: 0 0 0 3px var(--terracotta-200);
    background: #fff;
  }
  .error input { border-color: var(--danger); background: var(--danger-bg); }
  .help { font: var(--t-caption); color: var(--fg-3); }
  .err  { font: var(--t-caption); color: var(--danger); }
  .inline { display: flex; gap: 8px; align-items: center; background: var(--paper-50); border: 1px solid var(--border-default); border-radius: 8px; padding: 0 12px; }
  .inline input { background: transparent; border: 0; padding: 10px 0; flex: 1; }
  .inline span { font: var(--t-num); color: var(--fg-3); }
</style></head>
<body>
  <div class="field"><label>Business name</label><input value="Cafe Aurora"><div class="help">Shows on your member menu.</div></div>
  <div class="field"><label>Required visits</label>
    <div class="inline"><input type="number" value="3"><span>visits</span></div>
    <div class="help">Stamps to earn the reward.</div>
  </div>
  <div class="field error"><label>Email</label><input value="alice@cafe."><div class="err">That email looks incomplete.</div></div>
  <div class="field"><label>Currency</label>
    <select><option>EUR · €</option><option>USD · $</option><option>GBP · £</option></select>
  </div>
</body></html>
