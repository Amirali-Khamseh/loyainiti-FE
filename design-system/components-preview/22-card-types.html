<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-canvas); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .raised { background: #fff; border-radius: 12px; box-shadow: var(--shadow-1); padding: 16px; }
  .sunken { background: var(--paper-100); border: 1px solid var(--paper-200); border-radius: 8px; padding: 16px; }
  .stamp  { background: #fff; border-radius: 12px; box-shadow: var(--shadow-2); padding: 16px; border: 1px solid var(--gold-200); position: relative; }
  .stamp::after { content:""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 4px var(--gold-50); pointer-events:none;}
  .lbl { font: var(--t-label); color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.10em; margin-bottom: 6px; }
  .ti  { font: 600 14px/1.2 var(--font-body); color: var(--fg-1); }
  .ds  { font: var(--t-body-sm); color: var(--fg-2); margin-top: 4px; }
</style></head>
<body>
  <div class="raised"><div class="lbl">Raised card</div><div class="ti">Cafe Aurora</div><div class="ds">White on paper, shadow-1, 12px radius.</div></div>
  <div class="sunken"><div class="lbl">Sunken card</div><div class="ti">Notes</div><div class="ds">Paper-100, hairline border, no shadow.</div></div>
  <div class="stamp"><div class="lbl" style="color:var(--gold-600)">Stamp card</div><div class="ti">Reward earned</div><div class="ds">Gold inner ring · used for loyalty.</div></div>
</body></html>
